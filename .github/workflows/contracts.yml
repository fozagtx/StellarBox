name: Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STELLAR_CLI_VERSION: 27.0.0
  CARGO_TERM_COLOR: always

jobs:
  tx-max-policy:
    name: tx-max-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p tx-max-policy --all-targets -- -D warnings

      - name: Test
        run: cargo test -p tx-max-policy

      - name: Install Stellar CLI
        run: |
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Build wasm
        run: stellar contract build --package tx-max-policy

      - uses: actions/upload-artifact@v4
        with:
          name: tx-max-policy-wasm
          path: target/wasm32v1-none/release/tx_max_policy.wasm
          if-no-files-found: error
